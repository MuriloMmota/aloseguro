# A cada envio para o GitHub, compila o projeto e roda todos os testes automaticamente.
# O resultado aparece na aba "Actions" do repositório (✓ verde ou ✕ vermelho).
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e rodar os testes
        run: mvn -B verify

      - name: Mostrar relatório de desempenho
        if: always()
        run: cat target/relatorio-desempenho.txt || true

      - name: Guardar relatórios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes
          path: |
            backend/target/surefire-reports/
            backend/target/relatorio-desempenho.txt
