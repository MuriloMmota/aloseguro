# Sobe a API + um PostgreSQL local com um comando: docker compose up --build
# Para usar o Neon em vez do banco local, troque DB_URL, DB_USER e DB_PASSWORD
# e remova o serviço "banco".
services:
  banco:
    image: postgres:16
    environment:
      POSTGRES_DB: aloseguro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - dados-banco:/var/lib/postgresql/data

  api:
    build: ./backend
    depends_on:
      - banco
    environment:
      DB_URL: jdbc:postgresql://banco:5432/aloseguro
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: troque-esta-chave-por-uma-com-mais-de-32-caracteres
    ports:
      - "8080:8080"

volumes:
  dados-banco:
