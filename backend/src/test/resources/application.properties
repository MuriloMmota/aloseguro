spring.datasource.url=jdbc:h2:mem:aloseguro_teste;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

aloseguro.jwt.secret=chave-usada-apenas-nos-testes-automatizados-0001
aloseguro.jwt.expiracao-minutos=60

aloseguro.login.maximo-falhas=3
aloseguro.login.bloqueio-minutos=15

# Nos testes a IA fica desligada: o classificador por regras é usado
aloseguro.ia.api-key=
aloseguro.ia.base-url=http://localhost:9/v1
aloseguro.ia.modelo=modelo-de-teste
aloseguro.ia.timeout-segundos=1

aloseguro.demo.ativo=false
aloseguro.demo.quantidade=1000
aloseguro.demo.recriar=false
