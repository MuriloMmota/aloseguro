spring.application.name=aloseguro-api
server.port=${PORT:8080}

# ------------------------------------------------------------------
# Banco de dados (PostgreSQL)
# Os valores vêm de variáveis de ambiente. Para usar o Neon, configure
# DB_URL, DB_USER e DB_PASSWORD no IntelliJ (veja o README).
# Sem as variáveis, a aplicação tenta um PostgreSQL local.
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aloseguro}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ------------------------------------------------------------------
# JWT
# Em produção, defina JWT_SECRET com pelo menos 32 caracteres.
# ------------------------------------------------------------------
aloseguro.jwt.secret=${JWT_SECRET:aloseguro-chave-de-desenvolvimento-troque-em-producao-2026}
aloseguro.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}

# Popula o banco com dados de demonstração na primeira execução
aloseguro.dados-demo=${DADOS_DEMO:true}
