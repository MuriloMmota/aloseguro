spring.application.name=aloseguro-api
server.port=${PORT:8080}
# Respostas comprimidas: o site carrega mais rápido no celular
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript

# ------------------------------------------------------------------
# Banco de dados (PostgreSQL no Neon)
# Os valores vêm de variáveis de ambiente (IntelliJ ou Render).
# Sem as variáveis, a aplicação tenta um PostgreSQL local.
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aloseguro}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# Plano gratuito do Render tem pouca memória: poucas conexões bastam
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ------------------------------------------------------------------
# JWT
# Em produção, defina JWT_SECRET com pelo menos 32 caracteres.
# ------------------------------------------------------------------
aloseguro.jwt.secret=${JWT_SECRET:aloseguro-chave-de-desenvolvimento-troque-em-producao-2026}
aloseguro.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}

# Bloqueio de login após senhas erradas seguidas
aloseguro.login.maximo-falhas=5
aloseguro.login.bloqueio-minutos=15

# ------------------------------------------------------------------
# IA (LLM) que classifica os comentários das denúncias
# Padrão: Google Gemini pelo formato compatível com OpenAI.
# Sem LLM_API_KEY, o sistema usa só o classificador por palavras-chave.
# ------------------------------------------------------------------
aloseguro.ia.api-key=${LLM_API_KEY:}
aloseguro.ia.base-url=${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
aloseguro.ia.modelo=${LLM_MODEL:gemini-flash-latest}
aloseguro.ia.timeout-segundos=${LLM_TIMEOUT:8}

# ------------------------------------------------------------------
# Carga de dados FICTÍCIOS (roda só com o banco vazio)
# DADOS_DEMO_RECRIAR=true apaga tudo e gera de novo (use uma vez e volte para false)
# ------------------------------------------------------------------
aloseguro.demo.ativo=${DADOS_DEMO:true}
aloseguro.demo.quantidade=${DADOS_DEMO_QUANTIDADE:1000}
aloseguro.demo.recriar=${DADOS_DEMO_RECRIAR:false}
