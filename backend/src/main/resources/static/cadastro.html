<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AlôSeguro — Criar conta</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<header id="topo"></header>

<main>
    <div class="estreito">
        <h1>Criar conta</h1>
        <p class="subtitulo">A conta serve para registrar denúncias. A consulta de números é livre, sem login.</p>

        <form class="cartao" id="form-cadastro" novalidate>
            <label for="nome">Nome</label>
            <input id="nome" autocomplete="name" maxlength="100" required>

            <label for="email">E-mail</label>
            <input id="email" type="email" autocomplete="email" maxlength="150" required>

            <label for="senha">Senha <span class="opcional">(mínimo 6 caracteres)</span></label>
            <input id="senha" type="password" autocomplete="new-password" minlength="6" maxlength="72" required>

            <div id="aviso" class="aviso" hidden></div>

            <button class="botao largo" type="submit" id="botao">Criar conta</button>

            <p class="rodape-form">Já tem conta? <a href="entrar.html">Entrar</a></p>
        </form>
    </div>
</main>

<script src="js/app.js"></script>
<script>
    document.getElementById('form-cadastro').addEventListener('submit', async evento => {
        evento.preventDefault();
        const aviso = document.getElementById('aviso');
        const botao = document.getElementById('botao');
        aviso.hidden = true;
        botao.disabled = true;

        try {
            const resposta = await chamarApi('/auth/cadastro', {
                method: 'POST',
                body: JSON.stringify({
                    nome: document.getElementById('nome').value,
                    email: document.getElementById('email').value,
                    senha: document.getElementById('senha').value
                })
            });
            Sessao.salvar(resposta);
            location.href = parametro('voltar') || 'index.html';
        } catch (erro) {
            mostrarErro(aviso, erro);
            botao.disabled = false;
        }
    });
</script>
</body>
</html>
